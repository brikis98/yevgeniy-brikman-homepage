<form id="blog-nav">
  <div class="clearfix h6 pb1">
    <div id="search-blog" class="col pr05">
    </div>
    <div class="col pr05">
      <label for="filter-by-type" class="top-label bold">Filter by type</label>
    </div>
    <div class="col pr05">
      <label for="filter-by-tag" class="top-label bold">Filter by tag</label>
    </div>
    <div class="col pr05">
      <label for="filter-by-rating" class="top-label bold">Filter by rating</label>
    </div>
  </div>
  <div class="clearfix h6 border-top border-gray">
    <div class="col col-3">
      <i class="fa fa-rss-square" aria-hidden="true"></i> <a href="{{ site.nav.blog.rss }}">RSS feed</a>
    </div>
    <div class="col col-9 right-align">
      <span id="blog-post-count" class="bold">{{ paginator.posts | size }}</span> of {{ site.posts | size }} posts
    </div>
  </div>
  <div id="loading-spinner" class="mt4 center display-none">
    <i class="fa fa-spinner fa-spin" aria-hidden="true"></i> Loading...
  </div>
</form>
