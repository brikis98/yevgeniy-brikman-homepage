
<div id="blog-nav">
  <div class="clearfix h6 pb1">
    <div class="col pr1" style="width: 200px">
      <div><label for="search-blog" class="bold">Search</label></div>
      <div id="search-blog"></div>
    </div>
    <div class="col pr1" style="width: 135px">
      <div>
        <label for="filter-by-type-button" class="bold">Filter by type</label>
        <span id="clear-filter-by-type" class="ml1"></span>
      </div>
      <button id="filter-by-type-button" popovertarget="filter-by-type-popover" popovertargetaction="toggle" class="full-width button button-outline border border-gray regular">
        <span class="placeholder">Pick types</span>
        <span class="filter-selection"></span>
        <i class="fa fa-caret-down ml1" aria-hidden="true"></i>
      </button>
      <div id="filter-by-type-popover" popover="auto" class="absolute m0 p2 popover-bottom border border-gray">
        {% include loading-spinner.html %}
        <div id="filter-by-type"></div>
      </div>
    </div>
    <div class="col pr1" style="width: 135px">
      <div>
        <label for="filter-by-tag-button" class="bold">Filter by tag</label>
        <span id="clear-filter-by-tag" class="ml1"></span>
      </div>
      <button id="filter-by-tag-button" popovertarget="filter-by-tag-popover" popovertargetaction="toggle" class="full-width button button-outline border border-gray regular">
        <span class="placeholder">Pick tags</span>
        <span class="filter-selection"></span>
        <i class="fa fa-caret-down ml1" aria-hidden="true"></i>
      </button>
      <div id="filter-by-tag-popover" popover="auto" class="absolute m0 p2 popover-bottom border border-gray max-height-240 overflow-y-auto">
        {% include loading-spinner.html %}
        <div id="filter-by-tag"></div>
      </div>
    </div>
    <div class="col" style="width: 135px">
      <div>
        <label for="filter-by-type-button" class="bold">Filter by rating</label>
        <span id="clear-filter-by-rating" class="ml1"></span>
      </div>
      <button id="filter-by-rating-button" popovertarget="filter-by-rating-popover" popovertargetaction="toggle" class="full-width button button-outline border border-gray regular">
        <span class="placeholder">Pick ratings</span>
        <span class="filter-selection"></span>
        <i class="fa fa-caret-down ml1" aria-hidden="true"></i>
      </button>
      <div id="filter-by-rating-popover" popover="auto" class="absolute m0 p2 popover-bottom border border-gray">
        {% include loading-spinner.html %}
        <div id="filter-by-rating"></div>
      </div>
    </div>
  </div>
  <div class="clearfix h6 border-top border-gray">
    <div class="col col-3">
      <i class="fa fa-rss-square" aria-hidden="true"></i> <a href="{{ site.nav.blog.rss }}">RSS feed</a>
    </div>
    <div class="col col-9 right-align">
      <span id="algolia-blog-post-count" class="bold display-none"></span>
      <span id="original-blog-post-count" class="bold">{{ paginator.posts | size }}</span>
      of {{ site.posts | size }} posts
    </div>
  </div>
</div>
