
<div id="blog-nav">
  <div class="clearfix h6 pb1">
    <div id="search-blog" class="col pr05" style="width: 225px"></div>
    <div class="col pr05">
      <button id="filter-by-type-button" popovertarget="filter-by-type-popover" popovertargetaction="toggle" class="button button-outline border border-gray">
        Filter by type <i class="fa fa-caret-down" aria-hidden="true"></i>
      </button>
      <div id="filter-by-type-popover" popover="auto" class="absolute m0 p2 popover-bottom border border-gray">
        <div id="filter-by-type"></div>
      </div>
    </div>
    <div class="col pr05">
      <button id="filter-by-tag-button" popovertarget="filter-by-tag-popover" popovertargetaction="toggle" class="button button-outline border border-gray">
        Filter by tag <i class="fa fa-caret-down" aria-hidden="true"></i>
      </button>
      <div id="filter-by-tag-popover" popover="auto" class="absolute m0 p2 popover-bottom border border-gray max-height-240 overflow-y-scroll">
        <div id="filter-by-tag"></div>
      </div>
    </div>
    <div class="col pr05">
      <button id="filter-by-rating-button" popovertarget="filter-by-rating-popover" popovertargetaction="toggle" class="button button-outline border border-gray">
        Filter by rating <i class="fa fa-caret-down" aria-hidden="true"></i>
      </button>
      <div id="filter-by-rating-popover" popover="auto" class="absolute m0 p2 popover-bottom border border-gray">
        <div id="filter-by-rating"></div>
      </div>
    </div>
  </div>
  <div class="clearfix h6 border-top border-gray">
    <div class="col col-3">
      <i class="fa fa-rss-square" aria-hidden="true"></i> <a href="{{ site.nav.blog.rss }}">RSS feed</a>
    </div>
    <div class="col col-9 right-align">
      <span id="algolia-blog-post-count" class="bold display-none"></span>
      <span id="original-blog-post-count" class="bold">{{ paginator.posts | size }}</span>
      of {{ site.posts | size }} posts
    </div>
  </div>
  <div id="loading-spinner" class="mt4 center display-none">
    <i class="fa fa-spinner fa-spin" aria-hidden="true"></i> Loading...
  </div>
</div>
