{% for row in include.map %}
<div class="mb2">
  <p class="bold mb0">{{ row.title }}</p>
  <div class="flex flex-justify h6 mid-gray">
    <span>{{ row.left_label }}</span>
    <span>{{ row.right_label }}</span>
  </div>
  <div class="relative height-20 bg-darken-1 very-rounded">
    {% for flag in row.flags %}
    <div class="absolute" style="left: {{ flag.position }}%; top: -3px; ">{{ flag.label }}</div>
    {% endfor %}
  </div>
</div>
{% endfor %}
